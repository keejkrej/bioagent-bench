[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioagent-bench"
version = "0.2.0"
description = "An independent, synthetic computational-biology agent benchmark"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24,<2.1",
  "pandas>=2.0,<2.3",
  "scipy>=1.10,<1.14",
  "scikit-learn>=1.3,<1.6",
]

[project.scripts]
bioagent-bench = "bioagent_bench.cli:main"

[tool.setuptools.packages.find]
include = ["bioagent_bench*"]
